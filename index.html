    <script src="./config.js"></script>
    <style>
      .carregando-inicial {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        font-family: Asap, system-ui, sans-serif;
        color: #1e388b;
        background: #f4f6f9;
      }
      .carregando-inicial i {
        width: 36px;
        height: 36px;
        border: 4px solid #c4d0ee;
        border-top-color: #1e388b;
        border-radius: 50%;
        animation: girar 0.9s linear infinite;
      }
      @keyframes girar {
        to {
          transform: rotate(360deg);
        }
      }
    </style>

    <div id="app">
      <div class="carregando-inicial"><i></i><strong>Mapa de Obras SINFRA</strong><span>Carregando…</span></div>
